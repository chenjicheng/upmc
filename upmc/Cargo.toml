[package]
name = "upmc"
version = "0.4.8"
edition = "2024"

[dependencies]
# Native Slint interface; live-preview is deliberately not a default feature.
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility", "unstable-winit-030"] }

# HTTP 请求: 纯 Rust 实现，无需 OpenSSL
ureq = "3.2.0"

# JSON 序列化/反序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
url = "2"
fs2 = "0.4"

# 错误处理: 简化 Result 链
anyhow = "1.0.102"

# ZIP 解压: 用于解压下载的 JRE
zip = "8.1.0"

# SHA256: 用于自更新文件完整性校验
sha2 = "0.10"

# 获取用户目录（文档、桌面等）
dirs = "6"

# Discord 语音代理库
discord-voice-proxy = { path = "../discord-voice-proxy" }

# Windows 专用: 隐藏控制台窗口、设置 exe 属性
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["errhandlingapi", "fileapi", "handleapi", "winbase", "wincon", "winnt", "winuser"] }

[build-dependencies]
# 嵌入 exe 图标和版本信息
winresource = "0.1"
slint-build = "=1.17.1"

[dev-dependencies]
tempfile = "3"
i-slint-backend-testing = "=1.17.1"

